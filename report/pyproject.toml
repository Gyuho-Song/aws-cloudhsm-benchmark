[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsm-bmt-report"
version = "0.1.0"
description = "CloudHSM BMT Phase 1 — localized PDF/HTML report generator"
requires-python = ">=3.11"
authors = [{ name = "CloudHSM BMT Phase 1 team" }]
dependencies = [
  "pyarrow>=16.0",
  "boto3>=1.34",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "weasyprint>=62.0",
  "pydantic>=2.7",
  "babel>=2.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "moto>=5.0",
  "ruff>=0.4",
]

[project.scripts]
hsm-bmt-report = "hsm_bmt_report.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hsm_bmt_report = ["templates/**/*.j2", "static/*.css", "static/*.ttf", "static/*.otf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.ruff]
line-length = 100
target-version = "py312"
